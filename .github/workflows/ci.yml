name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.23
      - name: Web install and checks
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Python install and checks
        working-directory: services/api
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -q
      - name: Documentation and diff
        run: |
          python docs/evidence/validate_planning.py
          python docs/gates/GATE-01/evidence/validate.py
          git diff --exit-code -- package-lock.json services/api/uv.lock
          git diff --check
      - name: Record verified commit
        run: |
          mkdir -p ci-evidence
          echo "commit=$GITHUB_SHA" > ci-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-evidence
          path: ci-evidence/
