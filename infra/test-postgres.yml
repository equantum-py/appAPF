# E-02 ephemeral test database only; passwords are non-production fixture values.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: apf_e02_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_admin_only
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d apf_e02_test']
      interval: 5s
      timeout: 5s
      retries: 10
